<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mref API</title>
<!--
  Template for the mref API docs. The page is generated by
  mref.generate_docs() (also run by mref.generate_stubs()), which replaces
  the MREF_DATA marker below with the trait and node type data. Edit this
  template, not the generated docs/index.html.
-->
<style>
  :root {
    --bg: #fbfbfa;
    --panel: #f2f1ee;
    --text: #1e1e1c;
    --muted: #6b6a66;
    --line: #dddbd5;
    --accent: #2f5fd0;
    --accent-soft: #e6ecfb;
    --code-bg: #ecebe7;
    --sig: #8a3b12;
    --dim: #a3a19b;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171716;
      --panel: #1f1f1d;
      --text: #e8e6e1;
      --muted: #9a9890;
      --line: #33322f;
      --accent: #7ea2ff;
      --accent-soft: #24304d;
      --code-bg: #2a2926;
      --sig: #f0a77a;
      --dim: #6d6b65;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, pre, .sig {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 0.88em;
  }
  code { background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; }
  pre {
    background: var(--code-bg);
    padding: 0.8em 1em;
    border-radius: 6px;
    overflow-x: auto;
  }

  .layout { display: flex; min-height: 100vh; }
  nav {
    width: 290px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .nav-head { padding: 18px 16px 10px; border-bottom: 1px solid var(--line); }
  .nav-head h1 { margin: 0 0 10px; font-size: 1.15em; }
  .nav-head h1 a { color: var(--text); }
  #search {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  .nav-options { margin-top: 8px; font-size: 0.85em; color: var(--muted); }
  .nav-lists { overflow-y: auto; padding: 6px 0 24px; flex: 1; }
  .nav-lists h2 {
    font-size: 0.75em;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 14px 16px 4px;
  }
  .nav-lists a {
    display: block;
    padding: 2px 16px;
    color: var(--text);
    font-size: 0.92em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-lists a:hover { background: var(--accent-soft); text-decoration: none; }
  .nav-lists a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-lists .count { color: var(--muted); font-size: 0.85em; }

  main { flex: 1; min-width: 0; padding: 32px 40px 80px; max-width: 980px; }
  main h1 { margin: 0 0 4px; font-size: 1.8em; }
  .subtitle { color: var(--muted); margin: 0 0 20px; }
  .facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 18px; margin: 0 0 24px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; min-width: 0; }
  .facts code, .doc code { overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-block;
    padding: 1px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 0.88em;
    background: var(--panel);
  }
  .chip small { color: var(--muted); }
  .doc p { margin: 0 0 0.7em; }
  .doc ul { margin: 0 0 0.7em; padding-left: 1.3em; }

  section.trait-group { margin-top: 32px; }
  section.trait-group > h2 {
    font-size: 1.15em;
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
    margin-bottom: 4px;
  }
  section.trait-group > h2 small { color: var(--muted); font-weight: normal; }
  .method { padding: 14px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 12px; }
  .method:last-child { border-bottom: none; }
  .method .sig { font-size: 0.95em; overflow-wrap: anywhere; }
  .method .sig .name { font-weight: 700; color: var(--text); }
  .method .sig .args { color: var(--sig); }
  .method .meta { font-size: 0.82em; color: var(--muted); margin: 2px 0 6px; }
  .method .doc { margin-top: 6px; }
  .method.overridden .sig, .method.overridden .doc { opacity: 0.55; }
  .method.highlight { background: var(--accent-soft); margin: 0 -12px; padding: 14px 12px; border-radius: 6px; }
  .note { color: var(--muted); font-size: 0.9em; }
  table { border-collapse: collapse; width: 100%; font-size: 0.92em; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td:nth-child(2), td:nth-child(3), td:nth-child(4) { font-variant-numeric: tabular-nums; }
  .columns { columns: 220px; column-gap: 24px; }
  .columns a { display: block; break-inside: avoid; }
  .empty { color: var(--muted); font-style: italic; }

  @media (max-width: 760px) {
    .layout { display: block; }
    nav { position: static; width: auto; height: auto; border-right: none; border-bottom: 1px solid var(--line); }
    .nav-lists { max-height: 40vh; }
    main { padding: 24px 16px 60px; }
    .facts { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .facts dt { margin-top: 8px; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav>
    <div class="nav-head">
      <h1><a href="#">mref API</a></h1>
      <input id="search" type="search" placeholder="Search traits, node types, methods" autocomplete="off">
      <label class="nav-options"><input id="all-types" type="checkbox"> include node types with only generic traits</label>
    </div>
    <div class="nav-lists" id="nav-lists"></div>
  </nav>
  <main id="content"></main>
</div>

 "traits": {
  "AnimCurve": {
   "binds": [
    "kAnimCurve"
   ],
   "doc": "Trait bound to any node with ``MFn.kAnimCurve``. Provides\nserialisation of an anim curve's keys, tangents, infinity\nbehaviour and weighting state, plus a reconstruction method that\nrebuilds the same key data on a curve of the same type.\n\nIt also exposes key querying/editing (count, times, values, add,\ninsert, remove, evaluate), tangent and infinity types, weighting,\nthe curve type (``TL``, ``TA``, ``UU`` ...) and the attributes the\ncurve is driven by / drives.\n\nUnits: unless stated otherwise every time and value accepted or\nreturned by this trait is in Maya's current UI units (frames in the\ncurrent time unit, degrees for angular curves, the current linear\nunit for linear curves) \u2014 matching what ``cmds.keyframe`` reports.\nFor driven-key curves (``U*`` input) the \"time\" is the driver value.\n\nNote: :meth:`to_dictionary` only serialises the *shape* of the\ncurve. It does not record which attribute the curve drives, nor\nany character set, layer, or container membership.",
   "file": "mref/traits/animcurve.py",
   "methods": [
    {
     "doc": "",
     "kind": "",
     "name": "scale",
     "signature": "(scale_by: float)"
    },
    {
     "doc": "Serialise this anim curve to a dictionary containing the\ncurve's name, type, weighting state, infinity behaviour, and\nevery key (time, value, tangent types, tangent positions, and\nweights).",
     "kind": "",
     "name": "to_dictionary",
     "signature": "() -> dict"
    },
    {
     "doc": "Rebuild this curve's keys from a dictionary produced by\n``to_dictionary``. All existing keys on the curve are cleared\nfirst.\n\n:param data: A dictionary with the same shape as\n    ``to_dictionary`` returns. Keys must be in time-ascending\n    order \u2014 the order of ``data[\"keys\"]`` is taken to match\n    the curve-index of each key after insertion.",
     "kind": "",
     "name": "construct_from_dictionary",
     "signature": "(data: dict) -> None"
    },
    {
     "doc": "Returns the two-letter curve type taken from the node type \u2014\ninput then output: ``T`` (time) or ``U`` (unitless) followed by\n``L`` (linear), ``A`` (angular), ``T`` (time) or ``U``\n(unitless). For example ``\"TL\"`` for an ``animCurveTL``.",
     "kind": "",
     "name": "curve_type",
     "signature": "() -> str"
    },
    {
     "doc": "Returns True if this is a set-driven-key style curve \u2014 i.e. its\ninput is unitless (``UL``, ``UA``, ``UT``, ``UU``) and is driven\nby an attribute rather than by time.",
     "kind": "",
     "name": "is_driven_key",
     "signature": "() -> bool"
    },
    {
     "doc": "Returns the number of keys on this curve.",
     "kind": "",
     "name": "key_count",
     "signature": "() -> int"
    },
    {
     "doc": "Returns the time (or driver value, for driven keys) of every\nkey in index order, in UI units.",
     "kind": "",
     "name": "key_times",
     "signature": "() -> list[float]"
    },
    {
     "doc": "Returns the value of every key in index order, in UI units\n(e.g. degrees for an angular curve).",
     "kind": "",
     "name": "key_values",
     "signature": "() -> list[float]"
    },
    {
     "doc": "Returns the index of the key at exactly the given time (or\ndriver value), or None if there is no key there.",
     "kind": "",
     "name": "key_index",
     "signature": "(time: float) -> int | None"
    },
    {
     "doc": "Evaluates the curve at the given time (or driver value) and\nreturns the result in UI units. Works between and outside keys,\nhonouring tangents and pre/post infinity.",
     "kind": "",
     "name": "value_at",
     "signature": "(time: float) -> float"
    },
    {
     "doc": "Adds a key at the given time (or driver value) with the given\nvalue, both in UI units. If a key already exists at that time\nits value is replaced. Returns the index of the key.\n\n:param in_tangent_type: Optional cmds-style tangent name\n    (``\"auto\"``, ``\"linear\"``, ``\"flat\"``, ``\"step\"``,\n    ``\"spline\"``, ``\"clamped\"``, ...). None uses the global\n    default.\n:param out_tangent_type: As ``in_tangent_type``.",
     "kind": "",
     "name": "add_key",
     "signature": "(time: float, value: float, in_tangent_type: str | None=None, out_tangent_type: str | None=None) -> int"
    },
    {
     "doc": "Inserts a key at the given time (or driver value) without\nchanging the shape of the curve \u2014 the key takes the curve's\ncurrent value and neighbouring tangents are adjusted. If a key\nalready exists there its index is returned unchanged.",
     "kind": "",
     "name": "insert_key",
     "signature": "(time: float) -> int"
    },
    {
     "doc": "Removes the key at exactly the given time (or driver value).\nReturns True if a key was removed, False if there was none.\nUnlike ``cmds.cutKey`` this never deletes the curve node, even\nwhen the last key is removed.",
     "kind": "",
     "name": "remove_key",
     "signature": "(time: float) -> bool"
    },
    {
     "doc": "Shifts every key on the curve by the given time (or driver\nvalue) offset and value offset, both in UI units.",
     "kind": "",
     "name": "offset_keys",
     "signature": "(time_offset: float=0.0, value_offset: float=0.0) -> None"
    },
    {
     "doc": "Returns the ``(in, out)`` tangent type names of the key at the\ngiven index, using cmds-style names (``\"auto\"``, ``\"linear\"``\netc).",
     "kind": "",
     "name": "tangent_types",
     "signature": "(index: int) -> tuple[str, str]"
    },
    {
     "doc": "Sets the in and/or out tangent type of the key at the given\nindex, or of every key when ``index`` is None. Types use\ncmds-style names (``\"auto\"``, ``\"linear\"``, ``\"flat\"``,\n``\"step\"``, ``\"spline\"``, ``\"clamped\"``, ...); a type left as\nNone is not changed.",
     "kind": "",
     "name": "set_tangent_types",
     "signature": "(in_type: str | None=None, out_type: str | None=None, index: int | None=None) -> None"
    },
    {
     "doc": "Returns the pre-infinity behaviour as a cmds-style name \u2014\n``\"constant\"``, ``\"linear\"``, ``\"cycle\"``, ``\"cycleRelative\"``\nor ``\"oscillate\"``.",
     "kind": "",
     "name": "pre_infinity",
     "signature": "() -> str"
    },
    {
     "doc": "Sets the pre-infinity behaviour from a cmds-style name (see\n:meth:`pre_infinity`).",
     "kind": "",
     "name": "set_pre_infinity",
     "signature": "(infinity_type: str) -> None"
    },
    {
     "doc": "Returns the post-infinity behaviour as a cmds-style name (see\n:meth:`pre_infinity`).",
     "kind": "",
     "name": "post_infinity",
     "signature": "() -> str"
    },
    {
     "doc": "Sets the post-infinity behaviour from a cmds-style name (see\n:meth:`pre_infinity`).",
     "kind": "",
     "name": "set_post_infinity",
     "signature": "(infinity_type: str) -> None"
    },
    {
     "doc": "Returns True if the curve uses weighted tangents.",
     "kind": "",
     "name": "is_weighted",
     "signature": "() -> bool"
    },
    {
     "doc": "Sets whether the curve uses weighted tangents.",
     "kind": "",
     "name": "set_weighted",
     "signature": "(state: bool) -> None"
    },
    {
     "doc": "Returns the attributes this curve's ``output`` drives, skipping\nany unitConversion nodes. Note that if the curve feeds an\nintermediate node (e.g. a ``blendWeighted`` for stacked driven\nkeys, or an anim layer blend) that node's input is returned,\nnot the final attribute.",
     "kind": "",
     "name": "driven_attributes",
     "signature": "() -> mref.ReferenceList"
    },
    {
     "doc": "Returns the attribute connected to this curve's ``input`` \u2014\nthe driver of a driven-key curve \u2014 skipping unitConversion\nnodes. Returns None when nothing is connected (the normal case\nfor time-based curves, which implicitly use scene time).",
     "kind": "",
     "name": "driver_attribute",
     "signature": "() -> mref.ReferencedItem | None"
    }
   ],
   "priority": 0
  },

   "doc": "Trait bound to any node with ``MFn.kAnimLayer`` \u2014 animation layers,\nincluding the root ``BaseAnimation`` layer. Exposes the layer's\nweight, mute / solo / lock / override state, its place in the layer\nhierarchy, and the attributes which are animated on it.\n\n``animLayer`` derives from ``objectSet`` (and reports ``MFn.kSet``),\nso the generic ``ObjectSet`` trait is bound as well. Lock state is\nexposed as ``is_layer_locked`` / ``set_layer_locked`` so it does not\nshadow the node-locking ``lock`` / ``is_locked`` methods of\n``DependencyNode``.",

  "Attribute": {
   "binds": [],
   "doc": "Trait bound to any ``om.MPlug`` \u2014 every attribute on every node in\nthe scene. Exposes name / path resolution, value get/set,\nconnect/disconnect, type queries, and Python-type mapping, plus\ndefinition queries (default, min/max, enum names, dynamic),\nkeyable / channel box / lock / hidden state, nice name and alias,\narray / compound navigation, and deletion of dynamic attributes.\n\nEditing an attribute's definition (range, enum names, hidden, nice\nname) is only possible on dynamic attributes; those setters raise\nRuntimeError on static (node-type defined) attributes.\n\nAddressing forms:\n  * ``name(include_node=False)`` \u2014 bare attribute name\n    (``translateX``).\n  * ``name(include_node=True)`` \u2014 short form including the owning\n    node's short name (``cube.translateX``). Display-friendly but\n    ambiguous on DAG nodes with duplicate short names.\n  * ``full_name()`` / ``path()`` \u2014 fully qualified DAG path of the\n    owning node joined with the partial attribute name\n    (``|root|cube.translateX``). Safe for handing to ``cmds`` in\n    any scene. Both methods return the same string; ``path()`` is\n    an alias kept for backwards compat.\n\nThe owning node and the attribute's data type are both resolved\nlazily on first access (``node()`` and ``get_type()``) so\nconstructing an Attribute is cheap.",
   "file": "mref/traits/attribute_type.py",
   "methods": [
    {
     "doc": "This will return the mref.ReferencedItem object which this attribute\nbelongs to. Resolved lazily on first access.",
     "kind": "",
     "name": "node",
     "signature": "() -> mref.ReferencedItem"
    },
    {
     "doc": "Returns the short-form name of the attribute.\n\n:param include_node: If True, the returned string is prefixed\n    with the owning node's short name \u2014 e.g. ``cube.translateX``\n    for a DAG node, or ``multiplyDivide1.outputX`` for a\n    dependency node. For an unambiguous address that includes\n    the full DAG path (``|foo|bar|cube.translateX``), use\n    :meth:`full_name` or :meth:`path` instead \u2014 those are the\n    safe form to hand to ``cmds`` in scenes that may contain\n    duplicate short names.",
     "kind": "",
     "name": "name",
     "signature": "(include_node: bool=False) -> str"
    },
    {
     "doc": "Returns the fully qualified path of the attribute \u2014 the owning\nnode's DAG path joined with the attribute's partial name. This\nis the safe, unambiguous form to hand to ``cmds`` in scenes\nthat may contain duplicate short names.",
     "kind": "",
     "name": "full_name",
     "signature": "() -> str"
    },
    {
     "doc": "Alias for :meth:`full_name`. Both return the same fully\nqualified attribute path.",
     "kind": "",
     "name": "path",
     "signature": "() -> str"
    },
    {
     "doc": "This will set the value of the attribute. If the type is not declared\nthen the type will attempted to be resolved automatically using the value\ntype.",
     "kind": "",
     "name": "set",
     "signature": "(*args, **kwargs) -> None"
    },
    {
     "doc": "This will return the attribute value. The value type is determined by\nthe attribute type.",
     "kind": "",
     "name": "get",
     "signature": "(**kwargs) -> typing.Any"
    },
    {
     "doc": "Returns the data type of this attribute. Cached after the first\nquery \u2014 the underlying attribute's declared type does not\nchange at runtime.",
     "kind": "",
     "name": "get_type",
     "signature": "() -> str"
    },
    {
     "doc": "This will connect this attribute to the given attribute - making this attribute\ndrive the value of the other attribute.",
     "kind": "",
     "name": "connect",
     "signature": "(attribute: mref.ReferencedItem | str, force: bool=False, **kwargs) -> None"
    },
    {
     "doc": "Connect this attribute to the next free element of the given\nmulti-attribute. The target's existing logical indices are\nqueried; the new connection goes to ``max(existing) + 1``, or\n``[0]`` if the multi is currently empty.\n\n:param attribute: A multi-attribute (or a string addressing one).\n    The target must be a multi (array) attribute \u2014 non-multi\n    attributes will fail at the ``cmds.connectAttr`` step with\n    a Maya error referencing the malformed indexed plug.\n:param force: Forwarded to ``cmds.connectAttr``.",
     "kind": "",
     "name": "connect_next",
     "signature": "(attribute: mref.ReferencedItem | str, force: bool=False, **kwargs) -> None"
    },
    {
     "doc": "Disconnect this attribute from the given attribute. If no\nattribute is given, every connection to and from this attribute\nis disconnected.",
     "kind": "",
     "name": "disconnect",
     "signature": "(attribute: mref.ReferencedItem | str | None=None) -> None"
    },
    {
     "doc": "This will return a list of connected plugs",

  "Blendshape": {
   "binds": [
    "kBlendShape"
   ],
   "doc": "Trait bound to any node with ``MFn.kBlendShape``. Exposes the\nblendshape's geometry, scene-side target meshes, alias attributes,\nand a utility (:meth:`unpack`) to extract deformed result meshes\nfor any targets that don't currently have an explicit source mesh\nconnected. Also provides target management (add / remove / rename /\nin-betweens) addressed by name or index, target weights, and the\nblendshape-specific paintable base and per-target weights.",
   "file": "mref/traits/blendshape.py",
   "methods": [
    {
     "doc": "Returns the transform that owns the first geometry this\nblendshape deforms, or None if no geometry is connected.",
     "kind": "",
     "name": "geometry",
     "signature": "() -> mref.ReferencedItem | None"
    },
    {
     "doc": "Returns the transforms of every mesh in the scene that's\nconnected as a source for one of this blendshape's targets.\nWalks the\n``inputTarget[*].inputTargetGroup[*].inputTargetItem[*].inputGeomTarget``\nplug tree and collects any upstream meshes.\n\nOnly mesh shapes (``MFn.kMesh``) are returned \u2014 NURBS surface\ntargets, if any, are not included.",
     "kind": "",
     "name": "scene_targets",
     "signature": "() -> mref.ReferenceList"
    },
    {
     "doc": "Extracts a deformed result mesh for every target that doesn't\ncurrently have an explicit source mesh connected. Each\nextracted mesh is created by activating its target's weight\nin isolation, duplicating the base geometry to bake the\nresult, and reconnecting that duplicate as the target's\ninput mesh.\n\nTargets that already have a source mesh connected are\nskipped \u2014 only the \"missing source\" cases are extracted.\n\nOriginal blendshape weights are restored after extraction,\neven if an error occurs partway through (via try/finally).\n\n:return: List of names of the newly created mesh transforms.\n:raises RuntimeError: If the blendshape has no base geometry\n    connected.",
     "kind": "",
     "name": "unpack",
     "signature": "() -> list"
    },
    {
     "doc": "Disconnects every external connection driving this\nblendshape's weight aliases. Used by :meth:`unpack` to\nisolate each target before extraction; safe to call\nstandalone if you want to freeze the blendshape in its\ncurrent driven state.\n\nUses MEL's ``CBdeleteConnection`` because that's the only\nidiom that properly tears down breakdown-style connections\n(anim curves, set driven keys, animation layers, plain\nconnections) without leaving residue.\n\n``CBdeleteConnection`` lives in ``channelBoxCommand.mel`` and\nisn't auto-sourced until the user first interacts with Maya's\nchannel box, so we source it defensively up-front. MEL's\n``source`` is idempotent, and we swallow load errors so this\nworks in environments where the file doesn't exist (e.g.\nheadless installs); if the proc still isn't available\nafterwards the subsequent ``CBdeleteConnection`` call will\nfail loudly, which is the right behaviour.",
     "kind": "",
     "name": "disconnect_driving_inputs",
     "signature": "() -> None"

    {
     "doc": "Returns a ReferenceList of the blendshape's aliased weight\nattributes \u2014 one entry per target, addressed by its alias\nname rather than ``weight[i]``.",

     "name": "alias_attributes",

     "doc": "Returns a dict mapping each target's alias name to its\nunderlying weight plug, e.g.::\n\n    {\"smile\": \"weight[0]\", \"frown\": \"weight[1]\", ...}",
     "kind": "",
     "name": "weight_mapping",
     "signature": "() -> dict"
    },
    {
     "doc": "Returns the (sparse) logical weight indices of every target, in\nascending order.",
     "kind": "",
     "name": "target_indices",
     "signature": "() -> list[int]"
    },
    {
     "doc": "Returns the name (weight alias) of every target in index order.\nA target with no alias is reported as ``\"weight[i]\"``.",
     "kind": "",
     "name": "target_names",
     "signature": "() -> list[str]"
    },
    {
     "doc": "Returns the weight index of the target with the given name.\n\n:raises ValueError: If no target has that name.",
     "kind": "",
     "name": "target_index",
     "signature": "(name: str) -> int"
    },
    {
     "doc": "Returns the current weight of a target, given by name or index.",
     "kind": "",
     "name": "target_weight",
     "signature": "(target: str | int) -> float"
    },
    {
     "doc": "Sets the weight of a target, given by name or index.",
     "kind": "",
     "name": "set_target_weight",
     "signature": "(target: str | int, value: float) -> None"
    },
    {
     "doc": "Sets every target weight to zero. Weights that are driven by a\nconnection or locked are left untouched.",
     "kind": "",
     "name": "zero_weights",
     "signature": "() -> None"
    },
    {
     "doc": "Adds the given mesh as a new target, at the next free index\nunless ``index`` is given, and returns that index. The target is\nnamed after the mesh unless ``name`` is given.",
     "kind": "",
     "name": "add_target",
     "signature": "(mesh: mref.ReferencedItem | str, name: str=None, index: int=None) -> int"
    },
    {
     "doc": "Removes a target (given by name or index) entirely, including its\nweight, alias, in-betweens and paintable weights. Works whether or\nnot a source mesh is still connected.",
     "kind": "",
     "name": "remove_target",
     "signature": "(target: str | int) -> None"

    {
     "doc": "Renames a target (given by name or index) by re-aliasing its\nweight plug.",

     "name": "rename_target",
     "signature": "(target: str | int, new_name: str) -> None"
    },
    {
     "doc": "Adds the given mesh as an in-between of a target (given by name\nor index), triggered at the given weight (e.g. ``0.5``).",
     "kind": "",
     "name": "add_in_between",
     "signature": "(target: str | int, mesh: mref.ReferencedItem | str, weight: float) -> None"

    {
     "doc": "Returns the weights at which a target's in-betweens trigger,\nsorted ascending. The full target (weight ``1.0``) is excluded.",

     "signature": "(target: str | int) -> list[float]"

    {
     "doc": "Returns the per-component base weights painted on the\nblendshape for the given shape (default: first output shape).\n\nWhere Maya stores these changed between versions \u2014 up to 2024\nthey live in ``inputTarget[n].baseWeights``, from 2025 in the\ngeneric ``weightList`` (``baseWeights`` is then ignored). This\nis an alias of ``GeometryFilter.deformer_weights``, which reads\nwhichever one drives the deformation.",
     "kind": "",
     "name": "base_weights",
     "signature": "(shape: mref.ReferencedItem | str=None) -> list[float]"
    },
    {
     "doc": "Sets the per-component base weights for the given shape (default:\nfirst output shape). ``weights`` must have one entry per component.\nSee :meth:`base_weights` for where they are stored.",
     "kind": "",
     "name": "set_base_weights",
     "signature": "(weights: list[float], shape: mref.ReferencedItem | str=None) -> None"

    {
     "doc": "Returns the per-component paintable weights of a single target\n(``inputTargetGroup[i].targetWeights``) for the given shape\n(default: first output shape).",

    },
    {
     "doc": "Sets the per-component paintable weights of a single target for\nthe given shape (default: first output shape). ``weights`` must\nhave one entry per component.",

     "name": "set_target_component_weights",
     "signature": "(target: str | int, weights: list[float], shape: mref.ReferencedItem | str=None) -> None"
    }

  },

   "doc": "Trait bound to any node with ``MFn.kConstraint`` \u2014 point, orient,\nparent, scale, aim, pole-vector, and any other constraint type\nderived from Maya's constraint base. Exposes the constrained node\n(:meth:`driven`), the nodes driving the constraint\n(:meth:`drivers`), and the per-target weight attributes\n(:meth:`weight_attributes`).\n\nAlso provides target management (add / remove / per-target\nweight), offsets, interpolation type, skipped axes, rest position,\naim/up vector and world-up settings for aim-style constraints, and\na simple bake-out helper. Getters for settings a given constraint\ntype does not have (e.g. :meth:`aim_vector` on a point constraint)\nreturn None.",
   "file": "mref/traits/constraint.py",
   "methods": [
    {
     "doc": "Returns the node being driven by the constraint",
     "kind": "",
     "name": "driven",
     "signature": "() -> mref.ReferencedItem | None"
    },
    {
     "doc": "Returns the list of driver nodes feeding this constraint's\ntarget inputs. The constraint's own target hierarchy\nconnections (``targetParentMatrix``) are excluded \u2014 only true\ndriver transforms are returned.",
     "kind": "",
     "name": "drivers",
     "signature": "() -> mref.ReferenceList"
    },
    {
     "doc": "Returns the per-target weight attributes for the constraint.\nThe result is a ``ReferenceList`` of attribute ReferencedItems,\none entry per target.",
     "kind": "",
     "name": "weight_attributes",
     "signature": "() -> mref.ReferenceList"
    },
    {
     "doc": "Adds the given node as a new target of this constraint and\nreturns its weight attribute. Uses the constraint's own command\n(``cmds.pointConstraint`` etc.), which appends to the existing\nconstraint of that type on the driven node. Existing settings\nsuch as aim vectors are preserved.\n\n:param weight: The weight of the new target.\n:param maintain_offset: Forwarded as ``maintainOffset``; only\n    passed when True since not every constraint command (e.g.\n    ``poleVectorConstraint``) supports the flag.",
     "kind": "",
     "name": "add_target",
     "signature": "(driver: mref.ReferencedItem | str, weight: float=1.0, maintain_offset: bool=False) -> mref.ReferencedItem"
    },
    {
     "doc": "Removes the given node as a target of this constraint. Note\nthat Maya deletes the constraint node itself when its last\ntarget is removed.",
     "kind": "",
     "name": "remove_target",
     "signature": "(driver: mref.ReferencedItem | str) -> None"
    },
    {
     "doc": "Returns the weight of the given target. Raises ValueError if\nthe node is not a target of this constraint.",
     "kind": "",
     "name": "target_weight",
     "signature": "(driver: mref.ReferencedItem | str) -> float"
    },
    {
     "doc": "Sets the weight of the given target. Raises ValueError if the\nnode is not a target of this constraint.",
     "kind": "",
     "name": "set_target_weight",
     "signature": "(driver: mref.ReferencedItem | str, weight: float) -> None"
    },
    {
     "doc": "Returns the constraint-level ``offset`` as ``[x, y, z]`` (point,\norient, aim and scale constraints \u2014 this is what\n``maintainOffset`` writes to). Returns None for constraint types\nwithout one; parent constraints store offsets per target, see\n:meth:`target_offset`.\n\nNamed ``offset_values`` rather than ``offset`` so that\n``constraint.offset`` keeps resolving to the Maya attribute.",
     "kind": "",
     "name": "offset_values",
     "signature": "() -> list[float] | None"
    },
    {
     "doc": "Sets the constraint-level ``offset`` from ``[x, y, z]``. Raises\nRuntimeError on constraint types without one.",
     "kind": "",
     "name": "set_offset_values",
     "signature": "(values: list[float]) -> None"
    },
    {
     "doc": "Returns the per-target offset of a parent constraint as\n``{\"translate\": [x, y, z], \"rotate\": [x, y, z]}``. Returns None\nfor constraint types without per-target offsets. Raises\nValueError if the node is not a target of this constraint.",
     "kind": "",
     "name": "target_offset",
     "signature": "(driver: mref.ReferencedItem | str) -> dict | None"
    },
    {
     "doc": "Returns the rotation interpolation type of an orient or parent\nconstraint \u2014 one of ``\"noFlip\"``, ``\"average\"``, ``\"shortest\"``,\n``\"longest\"`` or ``\"cache\"``. Returns None for constraint types\nwithout one.",
     "kind": "",
     "name": "interpolation_type",
     "signature": "() -> str | None"
    },
    {
     "doc": "Sets the rotation interpolation type of an orient or parent\nconstraint (see :meth:`interpolation_type` for the names).",
     "kind": "",
     "name": "set_interpolation_type",
     "signature": "(interpolation_type: str) -> None"
    },
    {
     "doc": "Returns, for each channel this constraint type can drive\n(``\"translate\"``, ``\"rotate\"``, ``\"scale\"``), the axes that are\nNOT connected to the driven node \u2014 e.g. ``{\"translate\": [\"y\"]}``\nfor a point constraint created with ``skip=\"y\"``. Maya does not\nstore skip flags, so this is derived from the output\nconnections.",
     "kind": "",
     "name": "skipped_axes",
     "signature": "() -> dict[str, list[str]]"
    },
    {
     "doc": "Returns the rest position settings as a dictionary with an\n``\"enabled\"`` bool plus whichever of ``\"translate\"``,\n``\"rotate\"`` and ``\"scale\"`` this constraint type has, each as\n``[x, y, z]``. Returns None for constraint types without a rest\nposition (e.g. pole vector constraints).",
     "kind": "",
     "name": "rest_position",
     "signature": "() -> dict | None"
    },
    {
     "doc": "Sets any of the rest translate / rotate / scale values and\nwhether the rest position is enabled. Arguments left as None\nare not changed. Raises RuntimeError if a value is given that\nthis constraint type has no rest attribute for.",
     "kind": "",
     "name": "set_rest_position",
     "signature": "(translate: list[float] | None=None, rotate: list[float] | None=None, scale: list[float] | None=None, enabled: bool | None=None) -> None"
    },
    {
     "doc": "Returns the aim vector as ``[x, y, z]``, or None if this\nconstraint type has no aim vector.",
     "kind": "",
     "name": "aim_vector",
     "signature": "() -> list[float] | None"
    },
    {
     "doc": "Sets the aim vector from ``[x, y, z]``.",
     "kind": "",
     "name": "set_aim_vector",
     "signature": "(vector: list[float]) -> None"
    },
    {
     "doc": "Returns the up vector as ``[x, y, z]``, or None if this\nconstraint type has no up vector.",
     "kind": "",
     "name": "up_vector",
     "signature": "() -> list[float] | None"
    },
    {
     "doc": "Sets the up vector from ``[x, y, z]``.",
     "kind": "",
     "name": "set_up_vector",
     "signature": "(vector: list[float]) -> None"
    },
    {
     "doc": "Returns the world up type as the string used by\n``cmds.aimConstraint`` \u2014 ``\"scene\"``, ``\"object\"``,\n``\"objectrotation\"``, ``\"vector\"`` or ``\"none\"``. Returns None\nif this constraint type has no world up type.",
     "kind": "",
     "name": "world_up_type",
     "signature": "() -> str | None"
    },
    {
     "doc": "Sets the world up type (see :meth:`world_up_type` for names)\nvia the constraint's own command, so the world up object's\nmatrix is connected for you.\n\n:param world_up_object: Required by Maya for the ``\"object\"``\n    and ``\"objectrotation\"`` types.\n:param world_up_vector: Optional ``[x, y, z]`` world up vector\n    (used by ``\"vector\"`` and ``\"objectrotation\"``).",
     "kind": "",
     "name": "set_world_up_type",
     "signature": "(world_up_type: str, world_up_object: mref.ReferencedItem | str | None=None, world_up_vector: list[float] | None=None) -> None"
    },
    {
     "doc": "Returns the node whose matrix feeds the world up of an\naim-style constraint, or None if there is none.",
     "kind": "",
     "name": "world_up_object",
     "signature": "() -> mref.ReferencedItem | None"
    },
    {
     "doc": "Bakes the constrained channels of the driven node to keys over\nthe given frame range (defaults to the playback range) and, by\ndefault, deletes this constraint afterwards. Only the channels\nthis constraint actually drives are baked.",
     "kind": "",
     "name": "bake",
     "signature": "(start: float | None=None, end: float | None=None, delete_constraint: bool=True) -> None"
    }
   ],
   "priority": 0
  },
  "ConstructionHistory": {
   "binds": [],
   "doc": "Trait bound to Maya's poly and NURBS construction-history nodes \u2014\nany node with ``MFn.kPolyCreator`` (``polyCreator``: polyCube,\npolyPlane, polyUnite, ...), ``MFn.kMidModifier`` (``polyModifier``:\npolyExtrudeFace, polySmoothFace, polyBevel3, ...) or ``MFn.kCreate``\n(``abstractBaseCreate``: makeNurbSphere, makeNurbCircle, loft,\nrevolve, extrude, ...). Deformers are not construction history in\nthis sense and are handled by ``GeometryFilter``.\n\nExposes the geometry flowing in and out of the node, the shapes it\nultimately feeds, the rest of the history chain it is part of,\nenabling / disabling it, and baking history out of the shapes it\nfeeds while keeping their deformers.\n\nGeometry connections are found by attribute type: a connection\ncounts if either end is a typed mesh / NURBS curve / NURBS surface /\nsubdiv attribute, or both ends are generic attributes (groupParts,\ndeformer input / output geometry). Message, matrix and numeric\nconnections are ignored.",
   "file": "mref/traits/construction_history.py",
   "methods": [
    {
     "doc": "Returns the nodes directly feeding geometry into this node \u2014 the\nupstream history node or shape. Creator nodes with no geometry\ninput (polyCube, makeNurbSphere, ...) return an empty list.",
     "kind": "",
     "name": "geometry_inputs",
     "signature": "() -> mref.ReferenceList"
    },
    {
     "doc": "Returns the nodes this node directly feeds geometry into \u2014 the\nnext history node, deformer or shape downstream.",
     "kind": "",
     "name": "geometry_outputs",
     "signature": "() -> mref.ReferenceList"
    },
    {
     "doc": "Returns the shapes this node's geometry ends up in. The geometry\nis followed downstream through other history nodes, deformers and\nintermediate (original) shapes until a visible shape is reached,\nso for a deformed mesh this is the final deformed shape. Pass\n``include_intermediate=True`` to also include any intermediate\nshapes passed along the way.",
     "kind": "",
     "name": "output_shapes",
     "signature": "(include_intermediate: bool=False) -> mref.ReferenceList"
    },
    {
     "doc": "Returns the construction-history nodes upstream of this one in\nthe same chain, nearest first, stopping at the first shape. For\n``polyCube -> polyExtrudeFace -> polyBevel3`` the bevel returns\n``[polyExtrudeFace, polyCube]``.",
     "kind": "",
     "name": "upstream_history",
     "signature": "() -> mref.ReferenceList"
    },
    {
     "doc": "Returns the construction-history nodes downstream of this one in\nthe same chain, nearest first, stopping at the first shape. For\n``polyCube -> polyExtrudeFace -> polyBevel3`` the cube returns\n``[polyExtrudeFace, polyBevel3]``.",
     "kind": "",
     "name": "downstream_history",
     "signature": "() -> mref.ReferenceList"
    },
    {
     "doc": "Returns True if this node is contributing to the geometry, or\nFalse if its ``nodeState`` has been set to \"Has No Effect\" (or\nany other non-normal state).",
     "kind": "",
     "name": "is_enabled",
     "signature": "() -> bool"
    },
    {
     "doc": "Enables or disables this node. Disabling sets ``nodeState`` to\n\"Has No Effect\", so a modifier passes its input geometry through\nunchanged \u2014 useful to preview geometry without an operation\nwithout deleting it.",
     "kind": "",
     "name": "set_enabled",
     "signature": "(state: bool) -> None"
    },
    {
     "doc": "Bakes the construction history of every shape this node feeds\n(see :meth:`output_shapes`) into the shape, then removes the\nhistory. This affects the whole non-deformer history of those\nshapes, not only this node, and this node itself is typically\ndeleted as a result.\n\nUnlike ``cmds.delete(constructionHistory=True)`` this is safe on\ndeformed geometry: deformers (skin clusters, blendshapes, ...)\nare kept and keep working, only the modelling history beneath\nthem is baked. Returns the shapes that were baked.",
     "kind": "",
     "name": "bake_history_on_outputs",
     "signature": "() -> mref.ReferenceList"
    }
   ],
   "priority": 0
  },
  "Container": {
   "binds": [

   ],
   "doc": "Trait bound to any node with ``MFn.kContainerBase`` \u2014 asset\ncontainers (``container``) and DAG containers (``dagContainer``).\nExposes the member nodes, the published (bound) attributes, and the\nparent / child container hierarchy.\n\nNote that ``animLayer`` nodes derive from ``containerBase`` in the\nnode-type hierarchy but do not report ``kContainerBase``, so they\nare not bound.",
   "file": "mref/traits/container.py",

     "doc": "Returns the nodes which are direct members of this container.\nNested containers are returned as members, but not their\ncontents.",

     "name": "add_member_nodes",
     "signature": "(nodes: list | mref.ReferencedItem | str, include_network: bool=False) -> None"

    {

     "name": "published_attributes",

    {
     "doc": "Returns the container this container is nested within, or None\nif it is a top-level container.",
     "kind": "",
     "name": "parent_container",
     "signature": "() -> mref.ReferencedItem | None"

    {
     "doc": "Returns the containers nested directly within this container",

  "DagNode": {
   "binds": [
    "kDagNode"
   ],
   "doc": "Trait bound to any node with ``MFn.kDagNode`` \u2014 transforms, joints,\nlocators, all shape types, and anything else that lives in the DAG\nhierarchy. Exposes parent/child traversal, DAG-path queries, shape\naccess, and constraint discovery.\n\nPriority ``0`` (the default), so it sits above ``DependencyNode``\n(``-1``) in the resolution order \u2014 ``full_name()`` returns the DAG\npath rather than the short name for any DAG node.",
   "file": "mref/traits/dag_node.py",
   "methods": [
    {
     "doc": "Returns the full path (long) name of the node.",
     "kind": "",
     "name": "full_name",
     "signature": "() -> str"
    },
    {
     "doc": "Returns a list of children of the node.\n\nArgs:\n    recursive (bool, optional): If False (default) only immediate\n        children will be returned. If True all descendants will be\n        returned.\n    node_type (str, optional): Only return children of the specified\n        Maya node type.\n    name_match (str, optional): Substring filter on the child's short\n        name. Only children whose short name contains this substring\n        are returned. Matching is case-sensitive.\n    include_shapes (bool, optional): If True (default), shape children\n        are included in the result. Set to False to skip shapes \u2014\n        useful when iterating only transform children.\n\nReturns:\n    A list of mref.ReferencedItem instances.",
     "kind": "",
     "name": "children",
     "signature": "(recursive: bool=False, node_type: str=None, name_match: str=None, include_shapes: bool=True) -> list[mref.ReferencedItem]"
    },
    {
     "doc": "Returns the parent of this node, or None if this node is at the\nscene root.",
     "kind": "",
     "name": "parent",
     "signature": "() -> mref.ReferencedItem | None"
    },
    {
     "doc": "Returns all the parents of this node",
     "kind": "",
     "name": "all_parents",
     "signature": "() -> list[mref.ReferencedItem]"
    },
    {
     "doc": "This will set the parent of the current node. If the parent being\npassed is None, then this node will be parented to the scene root.",
     "kind": "",
     "name": "set_parent",
     "signature": "(parent: mref.ReferencedItem | str | None) -> None"
    },
    {
     "doc": "This will make the given node a child of this node. Goes through\n``cmds.parent`` so the operation is recorded in Maya's undo stack.\nNo-ops if ``child`` is this node itself, or if ``child`` is\nalready parented to this node.",
     "kind": "",
     "name": "add_child",
     "signature": "(child: mref.ReferencedItem | str) -> None"
    },
    {
     "doc": "This will make all the given nodes children of this node. Issued\nas a single ``cmds.parent`` call so the operation is recorded as\none entry in Maya's undo stack. Children that are this node\nitself, or are already parented to this node, are silently\nskipped \u2014 matching ``add_child``'s guard behaviour.",
     "kind": "",
     "name": "add_children",
     "signature": "(children: list[mref.ReferencedItem | str]) -> None"
    },
    {
     "doc": "This will return the MFnDagNode object of the current node",
     "kind": "",
     "name": "dag",
     "signature": "() -> om.MFnDagNode"
    },
    {
     "doc": "Returns a list of shapes belonging to the current node",
     "kind": "",
     "name": "shapes",
     "signature": "() -> list[mref.ReferencedItem]"
    },
    {
     "doc": "Returns the first shape belonging to this node, or None if it\nhas none.",
     "kind": "",
     "name": "shape",
     "signature": "() -> mref.ReferencedItem | None"
    },
    {
     "doc": "Returns the constraint nodes parented under this node.\n\nLimitation: only finds constraints that are direct children of\nthis node, which is the conventional Maya layout for constraints\ndriving a transform. Constraints that target this node but live\nelsewhere in the scene (custom rigs, exported skeletons, certain\npipeline conventions) are not returned by this method. Walk the\nconnection graph (``listConnections`` on the constraint output\nplugs) for those cases.\n\nUses Maya's type-inheritance check (``isAType=\"constraint\"``)\nrather than a substring match on the type name, so user-defined\nnodes whose type name happens to contain ``\"constraint\"`` won't\nbe falsely included.",
     "kind": "",
     "name": "constraints",
     "signature": "() -> mref.ReferenceList"
    },
    {
     "doc": "Return True if the transform has reset/frozen pivots.\n\nChecks that rotatePivot, scalePivot, rotatePivotTranslate and\nscalePivotTranslate are all at the origin. Accepts either a transform\nor a shape name.",
     "kind": "",
     "name": "has_zeroed_pivots",
     "signature": "(tolerance=1e-06)"
    },
    {
     "doc": "Locks the nine scalar transform channels on this node \u2014 translateX/Y/Z,\nrotateX/Y/Z, scaleX/Y/Z. Does not lock visibility, nor the parent\ncompound translate/rotate/scale attributes themselves. Has no unlock\ncounterpart; call ``unlock_attributes`` with explicit channel names\nto reverse.",
     "kind": "",
     "name": "lock_transform_attributes",
     "signature": "(hide=False) -> None"
    },
    {
     "doc": "Unlocks the nine scalar transform channels on this node \u2014 translateX/Y/Z,\nrotateX/Y/Z, scaleX/Y/Z \u2014 reversing ``lock_transform_attributes``.\nDoes not touch visibility, nor the parent compound\ntranslate/rotate/scale attributes themselves.",
     "kind": "",
     "name": "unlock_transform_attributes",
     "signature": "(hide=False) -> None"
    },
    {
     "doc": "Returns the MDagPath of this node. For an instanced node this is\nthe path of the first instance.",
     "kind": "",
     "name": "dag_path",
     "signature": "() -> om.MDagPath"
    },
    {
     "doc": "Returns the top-most ancestor of this node (the node directly\nunder the scene root), or this node itself if it has no parent.",
     "kind": "",
     "name": "root",
     "signature": "() -> mref.ReferencedItem"
    },
    {
     "doc": "Returns the other children of this node's parent, not including\nthis node. For a node at the scene root this is the other\ntop-level nodes (including the default cameras).\n\n:param include_shapes: If False, shape nodes are skipped.",
     "kind": "",
     "name": "siblings",
     "signature": "(include_shapes: bool=True) -> mref.ReferenceList"
    },
    {
     "doc": "Returns the number of DAG paths to this node \u2014 1 for a node that\nis not instanced. Includes indirect instancing (an instanced\nparent).",
     "kind": "",
     "name": "instance_count",
     "signature": "() -> int"
    },
    {
     "doc": "Returns True if this node can be reached by more than one DAG\npath, either directly or through an instanced parent.",
     "kind": "",
     "name": "is_instanced",
     "signature": "() -> bool"
    },
    {
     "doc": "Returns True if this node is actually drawn \u2014 i.e. it and all of\nits parents are visible (taking ``visibility``, ``lodVisibility``,\ndrawing overrides and intermediate state into account). This\ndiffers from reading the ``visibility`` attribute, which ignores\nthe parents.",
     "kind": "",
     "name": "is_visible",
     "signature": "() -> bool"
    },
    {
     "doc": "Sets this node's ``visibility`` attribute on. Parents that are\nhidden will still hide it \u2014 see ``is_visible``.",
     "kind": "",
     "name": "show",
     "signature": "() -> None"
    },
    {
     "doc": "Sets this node's ``visibility`` attribute off.",
     "kind": "",
     "name": "hide",
     "signature": "() -> None"
    },
    {
     "doc": "Returns the world-space matrix of this node as a flat list of 16\nfloats, read directly from the DAG path. Works for shapes as well\nas transforms (a shape returns its transform's world matrix).\n\n:param inverse: If True, returns the inverse world matrix.",
     "kind": "",
     "name": "world_matrix",
     "signature": "(inverse: bool=False) -> list[float]"
    },
    {
     "doc": "Returns the custom outliner colour as an ``(r, g, b)`` tuple, or\nNone if the node does not use a custom outliner colour.",
     "kind": "",
     "name": "outliner_colour",
     "signature": "() -> tuple[float, float, float] | None"
    },
    {
     "doc": "Sets the colour this node's name is drawn with in the outliner,\nas ``(r, g, b)`` floats in the 0-1 range. Pass None to go back to\nthe default colour.",
     "kind": "",
     "name": "set_outliner_colour",
     "signature": "(colour: 'tuple[float, float, float]|None') -> None"
    },
    {
     "doc": "Returns the drawing-override display type of this node:\n``\"normal\"``, ``\"template\"`` or ``\"reference\"`` (unselectable).\nReturns ``\"normal\"`` when drawing overrides are not enabled.",
     "kind": "",
     "name": "display_override",
     "signature": "() -> str"
    },
    {
     "doc": "Sets the drawing-override display type of this node to\n``\"normal\"``, ``\"template\"`` or ``\"reference\"`` (unselectable).\nSetting template or reference enables drawing overrides; setting\nnormal leaves ``overrideEnabled`` alone so that any override\ncolour set on the node is kept.",
     "kind": "",
     "name": "set_display_override",
     "signature": "(display_type: str) -> None"
    }
   ],
   "priority": 0
  },
  "DeformerHandle": {
   "binds": [
    "kDeformFunc"
   ],
   "doc": "Trait bound to any node with ``MFn.kDeformFunc`` \u2014 the handle\nshapes of the nonLinear deformers (``deformBend``, ``deformTwist``,\n``deformFlare``, ``deformSine``, ``deformSquash`` and\n``deformWave``). Exposes the nonLinear deformer the handle drives,\nits deformer type and the geometry it deforms.\n\nThe handle's parameter attributes (curvature, bounds, ...) are\ndriven by the deformer, so edit them through the deformer's\n``set_parameter``.",
   "file": "mref/traits/deformer_handle.py",
   "methods": [
    {
     "doc": "Returns the nonLinear deformer this handle belongs to, or None\nif the handle is not connected to a deformer.",
     "kind": "",
     "name": "deformer",
     "signature": "() -> mref.ReferencedItem | None"
    },
    {
     "doc": "Returns the type of deformer this handle represents \u2014 one of\n``\"bend\"``, ``\"twist\"``, ``\"flare\"``, ``\"sine\"``, ``\"squash\"``\nor ``\"wave\"``.",
     "kind": "",
     "name": "deformer_type",
     "signature": "() -> str"
    },
    {

   "doc": "Trait bound to Maya's matrix utility nodes \u2014 ``multMatrix``,\n``addMatrix``, ``wtAddMatrix``, ``decomposeMatrix``,\n``composeMatrix``, ``pickMatrix``, ``blendMatrix``, ``aimMatrix``,\n``parentMatrix``, ``holdMatrix``, ``passMatrix``,\n``fourByFourMatrix``, ``uvPin`` and ``proximityPin`` (via their\n``MFn`` constants), plus the plugin-supplied ``inverseMatrix`` and\n``transposeMatrix`` (by type name, as they only report\n``kPluginDependNode``).\n\nExposes a uniform view over the differing attribute layouts of\nthese nodes: the output matrix value and plug, the ordered matrix\ninput plugs and their sources, appending inputs, TRS decomposition\nof the output, and wiring the result onto a transform.\n\nMatrices are flat lists of 16 floats in the same layout as\n``Transform.get_matrix`` (translation in elements 12-14).",

     "name": "input_matrix_attributes",

    {
     "doc": "Returns the attributes feeding this node's matrix inputs, in\ninput order. Unconnected inputs are skipped. Each entry is an\nattribute ReferencedItem (use ``.node()`` for the driving node).",
     "kind": "",
     "name": "matrix_sources",
     "signature": "() -> mref.ReferenceList"
    },
    {
     "doc": "Feeds a matrix into the next free input slot and returns the\ninput attribute used. Fixed inputs (``inputMatrix``,\n``primaryTargetMatrix``, ...) are filled first if unconnected;\nafter that a new element is appended to the node's array input\n(``matrixIn``, ``target``, ``wtMatrix``).\n\n``source`` may be an attribute (connected directly), a node\n(its ``worldMatrix[0]`` is connected) or a flat list of 16\nfloats (set as a static value). New ``wtAddMatrix`` elements\nget a weight of ``1.0``.",

     "name": "add_matrix_input",
     "signature": "(source: 'mref.ReferencedItem|str|list[float]') -> mref.ReferencedItem"

    {

     "signature": "(index: int=0) -> list[float]"

    {
     "doc": "Returns the rotation ``[x, y, z]`` in degrees of the node's output.\nFor a ``decomposeMatrix`` this is its ``outputRotate`` (which\nhonours ``inputRotateOrder``); for other nodes the output matrix\nis decomposed using the xyz rotate order.",

     "name": "output_rotation",

     "name": "output_scale",
     "signature": "(index: int=0) -> list[float]"

    {

     "kind": "",
     "name": "connect_output_to",
     "signature": "(transform: 'mref.ReferencedItem|str', offset_parent_matrix: bool=True, index: int=0) -> mref.ReferencedItem"
    }

  "Mesh": {
   "binds": [
    "kMesh"
   ],
   "doc": "Trait bound to any node with ``MFn.kMesh`` \u2014 polygon mesh shape\nnodes. Provides vertex position queries (single and bulk),\npolygon and edge counts, normals, UV sets and UVs, topology\nqueries (face / edge / connected / border vertices), closest point\nand ray intersection queries, shading engine discovery, skin\ncluster discovery, and the skinnable-shape protocol used by\n``SkinCluster`` to read and write weights.\n\nUnlike ``Transform``, this trait supports the full set of Maya\ntransformation spaces (``\"object\"``, ``\"world\"``, ``\"local\"``,\n``\"pretransform\"``, ``\"posttransform\"``, ``\"last\"``) via the\nunderlying ``MFnMesh`` API \u2014 see :meth:`vertex_positions` and the\nother space-aware methods. The function set is built from a DAG\npath on every call, so world space queries work and the trait\nstays valid if the shape is re-parented. Binding never touches the\nmesh data, so an empty mesh node (``cmds.createNode(\"mesh\")``) can\nstill be wrapped.",
   "file": "mref/traits/mesh.py",
   "methods": [
    {
     "doc": "Returns the total count of vertices making up the mesh",
     "kind": "",
     "name": "vertex_count",
     "signature": "() -> int"
    },
    {
     "doc": "Returns the total count of polygons making up the mesh",
     "kind": "",
     "name": "polygon_count",
     "signature": "() -> int"
    },
    {
     "doc": "Returns the total count of edges making up the mesh",
     "kind": "",
     "name": "edge_count",
     "signature": "() -> int"
    },
    {
     "doc": "This returns a list containing a list of three components correlating to\nthe x, y, z positions of the vertices.",
     "kind": "",
     "name": "vertex_positions",
     "signature": "(space: str='object') -> list[list[float]]"
    },
    {
     "doc": "This takes in a positions list, in the format:\n\n[\n    [x, y, z],\n    [x, y, z],\n    [x, y, z],\n    [x, y, z],\n    ...\n]\n\nWhere each triplet list defines the position of the vertex id in the\nlist order. ``positions`` must have exactly ``vertex_count()``\nentries \u2014 anything else raises ``ValueError``.",
     "kind": "",
     "name": "set_vertex_positions",
     "signature": "(positions: list[list[float]], space: str='object')"
    },
    {
     "doc": "This returns a list containing the three components correlating to\nthe x, y, z positions of the vertex.",
     "kind": "",
     "name": "vertex_position",
     "signature": "(vertex_id: int, space: str='object') -> list[float]"
    },
    {
     "doc": "This takes in a position list, in the format:\n\n    [x, y, z]\n\nThe vertex with the given id will then have its position set to those values.",
     "kind": "",
     "name": "set_vertex_position",
     "signature": "(vertex_id: int, position: list[float], space='object')"
    },
    {
     "doc": "Returns one ``[x, y, z]`` normal per vertex, in vertex index\norder. Each is the average of the vertex's face-vertex normals,\noptionally weighted by the face angle at the vertex. Uses a\nsingle bulk ``MFnMesh.getVertexNormals`` call.",
     "kind": "",
     "name": "vertex_normals",
     "signature": "(space: str='object', angle_weighted: bool=False) -> list[list[float]]"
    },
    {
     "doc": "Returns one ``[x, y, z]`` normal per polygon, in face index\norder.",
     "kind": "",
     "name": "face_normals",
     "signature": "(space: str='object') -> list[list[float]]"
    },
    {
     "doc": "Returns the vertex indices making up the face with the given id,\nin winding order. If ``face_id`` is None the vertex lists for\nevery face are returned (a list of lists, in face index order),\nread in a single bulk ``MFnMesh.getVertices`` call.",
     "kind": "",
     "name": "face_vertices",
     "signature": "(face_id: int | None=None) -> list[int] | list[list[int]]"
    },
    {
     "doc": "Returns the two vertex indices at either end of the edge with\nthe given id.",
     "kind": "",
     "name": "edge_vertices",
     "signature": "(edge_id: int) -> tuple[int, int]"
    },
    {
     "doc": "Returns the indices of every vertex sharing an edge with the\ngiven vertex.",
     "kind": "",
     "name": "connected_vertices",
     "signature": "(vertex_id: int) -> list[int]"
    },
    {
     "doc": "Returns the sorted indices of every vertex lying on an open\n(boundary) edge of the mesh. A closed mesh returns an empty\nlist.",
     "kind": "",
     "name": "border_vertices",
     "signature": "() -> list[int]"
    },
    {
     "doc": "Returns the names of all the UV sets on the mesh",
     "kind": "",
     "name": "uv_set_names",
     "signature": "() -> list[str]"
    },
    {
     "doc": "Returns the name of the mesh's current (working) UV set",
     "kind": "",
     "name": "current_uv_set",
     "signature": "() -> str"
    },
    {
     "doc": "Makes the given UV set the mesh's current (working) UV set.\nRaises ``ValueError`` if no UV set with that name exists.",
     "kind": "",
     "name": "set_current_uv_set",
     "signature": "(uv_set: str) -> None"
    },
    {
     "doc": "Returns the number of UVs in the given UV set, or in the current\nUV set if none is given.",
     "kind": "",
     "name": "uv_count",
     "signature": "(uv_set: str | None=None) -> int"
    },
    {
     "doc": "Returns one ``[u, v]`` pair per UV in the given UV set (or the\ncurrent UV set if none is given), in UV index order.",
     "kind": "",
     "name": "uvs",
     "signature": "(uv_set: str | None=None) -> list[list[float]]"
    },
    {
     "doc": "Sets every UV in the given UV set (or the current UV set if none\nis given) from a list of ``[u, v]`` pairs in UV index order, as\nreturned by :meth:`uvs`. Only the UV values change \u2014 face\nassignments are left untouched, so ``uvs`` must have exactly\n``uv_count(uv_set)`` entries or ``ValueError`` is raised.",
     "kind": "",
     "name": "set_uvs",
     "signature": "(uvs: list[list[float]], uv_set: str | None=None) -> None"
    },
    {
     "doc": "Returns the UV of the point on the mesh closest to ``position``\nas a tuple of ``(u, v, face_id)``. Useful for placing follicles\nor pinning objects to a surface.",
     "kind": "",
     "name": "uv_at_point",
     "signature": "(position: list[float], space: str='object', uv_set: str | None=None) -> tuple[float, float, int]"
    },
    {
     "doc": "Returns the point on the mesh closest to ``position`` as a tuple\nof ``([x, y, z], [nx, ny, nz], face_id)`` \u2014 the closest position,\nthe surface normal at that position and the id of the face it\nlies on. Both the input and the results are expressed in\n``space``.",
     "kind": "",
     "name": "closest_point",
     "signature": "(position: list[float], space: str='object') -> tuple[list[float], list[float], int]"
    },
    {
     "doc": "Casts a ray from ``source`` along ``direction`` and returns the\nnearest hit on the mesh as a tuple of ``([x, y, z], face_id)``,\nor None if the ray misses. ``source``, ``direction`` and the\nhit point are all expressed in ``space`` (world by default).\nHits further than ``max_distance`` are ignored, and\n``both_directions`` also tests the ray backwards from source.",
     "kind": "",
     "name": "ray_intersection",
     "signature": "(source: list[float], direction: list[float], space: str='world', max_distance: float=99999.0, both_directions: bool=False) -> tuple[list[float], int] | None"
    },
    {
     "doc": "Returns the shading engines (shading groups) assigned to this\nmesh \u2014 whole-object and per-face assignments alike \u2014 for the\nfirst instance of the shape.",
     "kind": "",
     "name": "shading_engines",
     "signature": "() -> mref.ReferenceList"
    },
    {
     "doc": "Returns a ReferencedItem for the SkinCluster bound to this\nmesh, or None if no skin cluster is connected.",
     "kind": "",
     "name": "skin",
     "signature": "() -> mref.ReferencedItem | None"
    },
    {
     "doc": "Returns the number of vertices in the mesh.\n\nPart of the skinnable-shape protocol consumed by\n:class:`SkinCluster`: ``component_count()`` is the number of\nweights that need to be supplied per influence.",
     "kind": "",
     "name": "component_count",
     "signature": "() -> int"
    },
    {
     "doc": "Returns the fully qualified path to the component with the\ngiven index \u2014 for meshes, this is ``<full_path>.vtx[N]``.\n\nPart of the skinnable-shape protocol consumed by\n:class:`SkinCluster`.",
     "kind": "",
     "name": "component_path",
     "signature": "(component_index: int) -> str"
    },
    {
     "doc": "Returns the fully qualified path to the face with the given id,\nin the form ``<full_path>.f[N]``.",
     "kind": "",
     "name": "face_component_path",
     "signature": "(face_id: int) -> str"
    },
    {
     "doc": "Returns the fully qualified path to the edge with the given id,\nin the form ``<full_path>.e[N]``.",
     "kind": "",
     "name": "edge_component_path",
     "signature": "(edge_id: int) -> str"
    }
   ],
   "priority": 1
  },

  "NurbsCurve": {
   "binds": [
    "kNurbsCurve"
   ],
   "doc": "Trait bound to any node with ``MFn.kNurbsCurve`` \u2014 nurbs curve\nshape nodes. Provides CV position queries (single and bulk),\ncounts of CVs / knots / spans, degree, form, knots, length and\nparameter range, point / tangent / normal at parameter, parameter\nat length, closest point queries, reversing, skin cluster\ndiscovery, and the skinnable-shape protocol used by\n``SkinCluster`` to read and write weights.\n\nUnlike ``Transform``, this trait supports the full set of Maya\ntransformation spaces (``\"object\"``, ``\"world\"``, ``\"local\"``,\n``\"pretransform\"``, ``\"posttransform\"``, ``\"last\"``) via the\nunderlying ``MFnNurbsCurve`` API \u2014 see :meth:`cv_positions` and\nthe other space-aware methods. The function set is built from a\nDAG path on every call, so world space queries work and the trait\nstays valid if the shape is re-parented. Binding never touches the\ncurve data, so an empty curve node (``cmds.createNode(\"nurbsCurve\")``)\ncan still be wrapped.",

<script>
(function () {
  const DATA = JSON.parse(document.getElementById("mref-data").textContent);
  const TRAITS = DATA.traits;
  const NODES = DATA.node_types;
  const TRAIT_NAMES = Object.keys(TRAITS).sort();
  const NODE_NAMES = Object.keys(NODES).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

  // -- Traits every node has. Node types bound to nothing beyond these are
  // -- hidden from the sidebar by default to keep it short.
  const GENERIC = new Set(["DependencyNode", "MayaObject"]);

  const content = document.getElementById("content");
  const navLists = document.getElementById("nav-lists");
  const search = document.getElementById("search");
  const allTypes = document.getElementById("all-types");

  // ---------------------------------------------------------------- helpers
  function esc(text) {
    return String(text).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  }

  function traitLink(name) {
    return TRAITS[name] ? `<a href="#trait/${encodeURIComponent(name)}">${esc(name)}</a>` : esc(name);
  }

  function nodeLink(name) {
    return `<a href="#node/${encodeURIComponent(name)}">${esc(name)}</a>`;
  }

  // -- Inline markup: ``code`` and :role:`target` (linked when the target
  // -- is a trait)
  function inline(text) {
    let html = esc(text);
    html = html.replace(/:(?:meth|class|func|data|attr):`~?([^`]+)`/g, (_, target) => {
      const name = target.replace(/^mref\.|\(\)$/g, "");
      return TRAITS[name] ? `<code>${traitLink(name)}</code>` : `<code>${esc(target)}</code>`;
    });
    html = html.replace(/``([^`]+)``/g, "<code>$1</code>");
    return html;
  }

  // -- Renders a docstring block by block (blocks are separated by blank
  // -- lines): :param: style fields, bullet lists, code (a block after
  // -- "::", or one whose later lines are indented relative to its first
  // -- line) and plain paragraphs
  function renderDoc(doc) {
    if (!doc) return "";
    const blocks = doc.split(/\n\s*\n/).map(block => block.replace(/\s+$/, "").split("\n")).filter(b => b[0].trim() || b.length > 1);
    const indentOf = line => line.match(/^ */)[0].length;
    const out = [];
    let expectCode = false;

    // -- Joins items which start with a marker, folding continuation
    // -- lines into the item before them
    function items(lines, marker) {
      const result = [];
      for (const line of lines) {
        const match = line.match(marker);
        if (match || !result.length) result.push(match ? match[1] : line.trim());
        else result[result.length - 1] += " " + line.trim();
      }
      return result;
    }

    for (const lines of blocks) {
      const first = lines.find(l => l.trim()) || "";
      const firstIndent = indentOf(first);
      const nested = lines.slice(1).some(l => l.trim() && indentOf(l) > firstIndent);

      if (/^\s*:(param|type|return|returns|rtype|raises?)\b/.test(first)) {
        const fields = items(lines, /^\s*:(.*)$/).map(field => {
          const [, name, text] = field.match(/^([^:]*):\s*(.*)$/) || [null, field, ""];
          const label = name.replace(/^(param|type|raises?)\s+/, (_, kind) => kind.startsWith("raise") ? "raises " : (kind === "type" ? "type of " : ""));
          return `<li><code>${esc(label)}</code> ${inline(text)}</li>`;
        });
        out.push(`<ul>${fields.join("")}</ul>`);
      } else if (/^\s*[-*]\s+/.test(first)) {
        out.push("<ul>" + items(lines, /^\s*[-*]\s+(.*)$/).map(item => `<li>${inline(item)}</li>`).join("") + "</ul>");
      } else if (expectCode || nested || firstIndent >= 3) {
        const indent = Math.min(...lines.filter(l => l.trim()).map(indentOf));
        out.push(`<pre>${esc(lines.map(l => l.slice(indent)).join("\n"))}</pre>`);
        expectCode = false;
        continue;
      } else {
        let text = lines.map(l => l.trim()).join(" ");
        if (text.endsWith("::")) { text = text.slice(0, -1); expectCode = true; }
        out.push(`<p>${inline(text)}</p>`);
        continue;
      }
      expectCode = false;
    }
    return `<div class="doc">${out.join("")}</div>`;
  }

  function firstSentence(doc) {
    const text = (doc || "").split("\n\n")[0].replace(/\s+/g, " ").trim();
    const match = text.match(/^(.+?\.)(\s|$)/);
    return match ? match[1] : text;
  }

  function renderMethod(trait, method, options = {}) {
    const id = `m-${trait}-${method.name}`;
    const kind = method.kind ? `<span class="note">@${esc(method.kind)}</span> ` : "";
    let meta = `from ${traitLink(trait)}`;
    if (options.overriddenBy) meta += ` · overridden by ${traitLink(options.overriddenBy)} on this node type`;
    if (options.overrides && options.overrides.length) meta += ` · overrides ${options.overrides.map(traitLink).join(", ")}`;
    return `<div class="method${options.overriddenBy ? " overridden" : ""}" id="${esc(id)}">
      <div class="sig">${kind}<span class="name">${esc(method.name)}</span><span class="args">${esc(method.signature)}</span></div>
      <div class="meta">${meta}</div>
      ${renderDoc(method.doc) || '<div class="empty">No docstring.</div>'}
    </div>`;
  }

  function bindsText(trait) {
    const binds = TRAITS[trait].binds;
    return binds.length ? binds.map(b => `<code>MFn.${esc(b)}</code>`).join(" or ") : '<span class="note">a custom check — see the trait\'s <code>can_bind</code></span>';
  }

  function nodeTypesFor(trait) {
    return NODE_NAMES.filter(node => NODES[node].traits.includes(trait));
  }

  // ---------------------------------------------------------------- pages
  function homePage() {
    const specific = NODE_NAMES.filter(n => NODES[n].traits.some(t => !GENERIC.has(t))).length;
    const methodCount = TRAIT_NAMES.reduce((sum, t) => sum + TRAITS[t].methods.length, 0);
    const traitRows = TRAIT_NAMES.map(t => `<tr>
        <td>${traitLink(t)}</td><td>${TRAITS[t].priority}</td>
        <td>${TRAITS[t].methods.length}</td><td>${nodeTypesFor(t).length}</td>
        <td>${inline(firstSentence(TRAITS[t].doc))}</td></tr>`).join("");
    return `<h1>mref API</h1>
      <p class="subtitle">${TRAIT_NAMES.length} traits · ${methodCount} methods · ${NODE_NAMES.length} node types (${specific} with specific traits)</p>
      <div class="doc">
        <p>Every node you get from mref has the methods of each trait that binds to it. Open a
        <strong>node type</strong> to see everything available on that kind of node, grouped by the trait it
        comes from, or a <strong>trait</strong> to see its methods and the node types it applies to.</p>
        <p>When two traits on a node define the same method, the higher priority trait wins; the node type page
        marks the overridden one.</p>
        <p>These docs are generated from the trait source. After adding or changing a trait, run
        <code>mref.generate_stubs()</code> in Maya to regenerate them along with the typing stubs.</p>
      </div>
      <section class="trait-group"><h2>Traits</h2>
      <div style="overflow-x:auto"><table class="trait-table">
        <thead><tr><th>Trait</th><th>Priority</th><th>Methods</th><th>Node types</th><th>Summary</th></tr></thead>
        <tbody>${traitRows}</tbody></table></div></section>
      <section class="trait-group"><h2>Every ReferencedItem</h2>
        <p class="note">Methods of <code>mref.ReferencedItem</code> itself, available on every node and attribute.</p>
        ${DATA.core.map(m => renderMethod("ReferencedItem", m)).join("")}
      </section>`;
  }

  function traitPage(name) {
    const trait = TRAITS[name];
    if (!trait) return notFound(`trait "${name}"`);
    const nodes = nodeTypesFor(name);
    const nodeList = nodes.length
      ? `<div class="columns">${nodes.map(nodeLink).join("")}</div>`
      : `<p class="empty">${name === "Attribute" ? "Binds to attributes (plugs), not nodes." : "No node types recorded — regenerate with mref.generate_stubs()."}</p>`;
    return `<h1>${esc(name)}</h1>
      <p class="subtitle">Trait · <code>${esc(trait.file)}</code></p>
      <dl class="facts">
        <dt>Binds to</dt><dd>${bindsText(name)}</dd>
        <dt>Priority</dt><dd>${trait.priority}</dd>
        <dt>Typing class</dt><dd><code>mref.types.${esc(name)}Trait</code></dd>
        <dt>Node types</dt><dd>${nodes.length}</dd>
      </dl>
      ${renderDoc(trait.doc)}
      <section class="trait-group"><h2>Methods <small>${trait.methods.length}</small></h2>
        ${trait.methods.map(m => renderMethod(name, m)).join("") || '<p class="empty">No public methods.</p>'}
      </section>
      <section class="trait-group"><h2>Node types <small>${nodes.length}</small></h2>${nodeList}</section>`;
  }

  function nodePage(name) {
    const node = NODES[name];
    if (!node) return notFound(`node type "${name}"`);

    // -- Traits are stored highest priority first, which is the order
    // -- mref resolves methods in
    const winner = {};
    const losers = {};
    for (const trait of node.traits) {
      for (const method of TRAITS[trait] ? TRAITS[trait].methods : []) {
        if (winner[method.name]) (losers[method.name] = losers[method.name] || []).push(trait);
        else winner[method.name] = trait;
      }
    }

    const chips = node.traits.map(t => `<span class="chip">${traitLink(t)} <small>${TRAITS[t] ? TRAITS[t].priority : ""}</small></span>`).join("");
    const groups = node.traits.filter(t => TRAITS[t]).map(trait => {
      const methods = TRAITS[trait].methods.map(m => renderMethod(trait, m, {
        overriddenBy: winner[m.name] !== trait ? winner[m.name] : null,
        overrides: winner[m.name] === trait ? losers[m.name] : null,
      })).join("");
      return `<section class="trait-group"><h2>${traitLink(trait)} <small>priority ${TRAITS[trait].priority} · ${TRAITS[trait].methods.length} methods</small></h2>
        <p class="note">${inline(firstSentence(TRAITS[trait].doc))}</p>${methods || '<p class="empty">No public methods.</p>'}</section>`;
    }).join("");

    const total = Object.keys(winner).length;
    return `<h1>${esc(name)}</h1>
      <p class="subtitle">Maya node type · ${total} methods from ${node.traits.length} traits</p>
      <dl class="facts">
        <dt>Traits</dt><dd class="chips">${chips}</dd>
        <dt>Typing class</dt><dd><code>mref.types.${esc(node.class_name)}</code></dd>
        <dt>Create</dt><dd><code>mref.create(${esc(JSON.stringify(name))})</code> — typed automatically in PyCharm and VS Code</dd>
        <dt>Annotate</dt><dd><code>node: mref.types.${esc(node.class_name)} = mref.get("...")</code></dd>
      </dl>
      ${groups}`;
  }

  function searchPage(query) {
    const q = query.toLowerCase();
    const traits = TRAIT_NAMES.filter(t => t.toLowerCase().includes(q));
    const nodes = NODE_NAMES.filter(n => n.toLowerCase().includes(q));
    const methods = [];
    for (const t of TRAIT_NAMES) for (const m of TRAITS[t].methods) if (m.name.toLowerCase().includes(q)) methods.push([t, m]);
    return `<h1>Search: ${esc(query)}</h1>
      <p class="subtitle">${traits.length} traits · ${nodes.length} node types · ${methods.length} methods</p>
      ${traits.length ? `<section class="trait-group"><h2>Traits</h2><div class="columns">${traits.map(traitLink).join("")}</div></section>` : ""}
      ${methods.length ? `<section class="trait-group"><h2>Methods</h2>${methods.map(([t, m]) => `<div class="method"><div class="sig"><a href="#trait/${encodeURIComponent(t)}/${encodeURIComponent(m.name)}" class="name">${esc(t)}.${esc(m.name)}</a><span class="args">${esc(m.signature)}</span></div><div class="doc"><p>${inline(firstSentence(m.doc))}</p></div></div>`).join("")}</section>` : ""}
      ${nodes.length ? `<section class="trait-group"><h2>Node types</h2><div class="columns">${nodes.map(nodeLink).join("")}</div></section>` : ""}`;
  }

  function notFound(what) {
    return `<h1>Not found</h1><p>There is no ${esc(what)} in these docs. <a href="#">Back to the overview</a>.</p>`;
  }

  // ---------------------------------------------------------------- navigation
  function renderNav() {
    const q = search.value.trim().toLowerCase();
    const showAll = allTypes.checked || q;
    const traits = TRAIT_NAMES.filter(t => !q || t.toLowerCase().includes(q));
    const nodes = NODE_NAMES.filter(n =>
      (showAll || NODES[n].traits.some(t => !GENERIC.has(t))) && (!q || n.toLowerCase().includes(q)));
    navLists.innerHTML =
      `<h2>Traits <span class="count">${traits.length}</span></h2>` +
      traits.map(t => `<a href="#trait/${encodeURIComponent(t)}" data-route="trait/${esc(t)}">${esc(t)}</a>`).join("") +
      `<h2>Node types <span class="count">${nodes.length}</span></h2>` +
      nodes.map(n => `<a href="#node/${encodeURIComponent(n)}" data-route="node/${esc(n)}">${esc(n)}</a>`).join("");
    markActive();
  }

  function markActive() {
    const route = decodeURIComponent(location.hash.slice(1)).split("/").slice(0, 2).join("/");
    for (const link of navLists.querySelectorAll("a")) link.classList.toggle("active", link.dataset.route === route);
  }

  function route() {
    const parts = location.hash.slice(1).split("/").map(decodeURIComponent);
    if (parts[0] === "trait") content.innerHTML = traitPage(parts[1]);
    else if (parts[0] === "node") content.innerHTML = nodePage(parts[1]);
    else if (parts[0] === "search") content.innerHTML = searchPage(parts.slice(1).join("/"));
    else content.innerHTML = homePage();

    markActive();
    const method = parts[0] === "trait" && parts[2] ? document.getElementById(`m-${parts[1]}-${parts[2]}`) : null;
    if (method) { method.classList.add("highlight"); method.scrollIntoView(); }
    else window.scrollTo(0, 0);
  }

  let searchTimer = null;
  search.addEventListener("input", () => {
    renderNav();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const q = search.value.trim();
      if (q) history.replaceState(null, "", "#search/" + encodeURIComponent(q));
      else if (location.hash.startsWith("#search/")) history.replaceState(null, "", "#");
      route();
    }, 200);
  });
  allTypes.addEventListener("change", renderNav);
  window.addEventListener("hashchange", route);

  // -- A shared #search/... link fills the search box
  if (location.hash.startsWith("#search/")) search.value = decodeURIComponent(location.hash.slice(8));

  renderNav();
  route();
})();
</script>
</body>
</html>
